<!DOCTYPE html>
<html lang="pt-br" class="h-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Sistema de Análise de Controle{% endblock %}</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="icon" href="{{ url_for('static', filename='logo.png') }}?v=2">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                    },
                }
            }
        }
    </script>
    <style>
        body {
            background-color: #f1f5f9; /* slate-100 */
        }
        .card {
            background-color: white;
            border-radius: 0.75rem; /* rounded-xl */
            box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1), 0 2px 4px -2px rgb(0 0 0 / 0.1); /* shadow-md */
            transition: all 0.3s ease;
        }
        .card:hover {
            box-shadow: 0 10px 15px -3px rgb(0 0 0 / 0.1), 0 4px 6px -4px rgb(0 0 0 / 0.1); /* shadow-lg */
            transform: translateY(-4px);
        }
    </style>
</head>
<body class="h-full flex flex-col font-sans">

    <header class="bg-white shadow-sm">
        <nav class="container mx-auto px-4 lg:px-8">
            <div class="flex items-center justify-between h-16">
                <a href="/" class="flex items-center space-x-2 text-2xl font-bold text-slate-800">
                    <img src="{{ url_for('static', filename='logo.png') }}" alt="Logo" class="h-16 w-auto">
                    <h1>PID-Analyzer</h1>
                </a>
                <div class="flex items-center space-x-4">
                    <a href="/" class="text-gray-600 hover:text-green-800 font-medium px-3 py-2 rounded-md">Início</a>
                    <a href="/tutorial" class="text-gray-600 hover:text-green-800 font-medium px-3 py-2 rounded-md">Guia de Uso</a>
                    <a href="/modelagem" class="bg-green-800 text-white hover:bg-green-900 font-medium px-4 py-2 rounded-md shadow-sm transition-colors">Nova Modelagem</a>
                </div>
            </div>
        </nav>
    </header>

    <main class="flex-grow container mx-auto p-4 sm:p-6 lg:p-8">
        {% block content %}{% endblock %}
    </main>

    <footer class="bg-white mt-8">
        <div class="container mx-auto py-4 px-4 lg:px-8 text-center text-gray-500">
            <p>&copy; 2025 - Trabalho de Conclusão de Curso. Todos os direitos reservados.</p>
        </div>
    </footer>
    
    <div id="loading-overlay" class="hidden fixed inset-0 bg-gray-900 bg-opacity-60 flex items-center justify-center z-50 transition-opacity duration-300">
        <div class="flex flex-col items-center">
            <div class="w-16 h-16 border-4 border-white border-t-transparent border-solid rounded-full animate-spin"></div>
            <span class="mt-4 text-white text-xl font-medium">Processando...</span>
        </div>
    </div>

    <script>
        // Funções de controle do Loading
        function showLoading() {
            document.getElementById('loading-overlay').classList.remove('hidden');
        }
        function hideLoading() {
            document.getElementById('loading-overlay').classList.add('hidden');
        }

        window.addEventListener('pageshow', (event) => {
            hideLoading();
        });
    </script>

</body>
</html>
